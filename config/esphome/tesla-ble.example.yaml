# DRAFT ESPHome device: local Bluetooth control of the Tesla, for Home Assistant and evcc.
#
# Status: untested against this installation. See docs/ROADMAP.md phase 1.
#
# Firmware: yoziru/esphome-tesla-ble, pinned below. It runs on an ESP32 placed within
# Bluetooth range of the Tesla's parking spot, holds its own BLE key to the car, and shows
# up in Home Assistant as an ESPHome device. No Tesla account, cloud API or subscription.
#
# Install with the ESPHome Device Builder add-on:
#   1. Create a new device. Keep the generated esphome:, api: and wifi: sections, and delete
#      the generated esp32:, logger:, ota: and captive_portal: sections (the board package
#      below supplies them).
#   2. Add the two secrets to ESPHome's secrets.yaml. The MAC comes from an Android BLE
#      scanner (the car advertises as "S" + 16 hex characters + "C"); iOS cannot show it.
#        tesla_ble_mac_address: "A0:B1:C2:D3:E4:F5"
#        tesla_vin: "<VIN>"
#   3. Add the sections below, pick the files: entry for your board, and Install.
#   4. Pair: press "Pair BLE Key" on the device page, then tap a Tesla key card on the
#      center-console reader within 30 s. The ESP32 then appears under Locks on the car.
#
# Entity IDs follow friendly_name; with "Tesla BLE" they are switch.tesla_ble_charger,
# number.tesla_ble_charging_amps, number.tesla_ble_charging_limit, sensor.tesla_ble_battery,
# binary_sensor.tesla_ble_charger (cable connected), binary_sensor.tesla_ble_ble_connection
# and button.tesla_ble_wake_up. The evcc config and the glue package assume these names.

substitutions:
  name: tesla-ble
  friendly_name: Tesla BLE
  # A release tag, so a firmware update is a deliberate change.
  tesla_ble_ref: v2026.10.3
  ble_mac_address: !secret tesla_ble_mac_address
  tesla_vin: !secret tesla_vin

packages:
  yoziru.esphome-tesla-ble:
    url: https://github.com/yoziru/esphome-tesla-ble.git
    ref: ${tesla_ble_ref}
    # tesla-ble-m5stack-nanoc6.dashboard.yml, tesla-ble-m5stack-atoms3.dashboard.yml, or
    # tesla-ble-esp32-generic.dashboard.yml (classic ESP32 only), matching the board.
    files: [tesla-ble-m5stack-nanoc6.dashboard.yml]

tesla_ble_vehicle:
  # Charging only: start/stop, amps, limit and charge port. It cannot unlock or drive the
  # car, which matters for a key stored on a device in the garage. Some car software does
  # not let this role wake the car; if "Wake up" is refused during commissioning, re-pair
  # with DRIVER.
  role: CHARGING_MANAGER
  # The firmware's default ceiling is 32 A. Set this to what the car accepts on the Wall
  # Connector (the "Car Max Acceptable" sensor), at most 48, and use the same value as
  # maxCurrent for the Tesla in evcc.yaml.
  charging_amps_max: 48
