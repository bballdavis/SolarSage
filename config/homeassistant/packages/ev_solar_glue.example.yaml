# DRAFT Home Assistant package: glue between HA, evcc, and the two vehicles.
#
# Status: untested against this installation. See docs/SOLAR_CHARGING_ARCHITECTURE.md
# and docs/ROADMAP.md (phase 0 validates the status sensors; phase 2 enables the
# watchdogs and the Tesla amp restore).
#
# Install: enable packages (homeassistant: packages: !include_dir_named packages),
# copy this file to /config/packages/ev_solar_glue.yaml, and replace every <placeholder>.
#
# Contents:
#   1. A manual override for which car is on the Wall Connector, and the Tesla's normal
#      charging amps.
#   2. A location- and charger-aware Tesla status sensor for evcc vehicle detection
#      (a/b/c). evcc identifies vehicles by status only. The sensor reports "a" unless
#      the Tesla is home and plugged in while the Wall Connector reports a vehicle, so
#      evcc never commands a car that is charging somewhere else.
#      The Rivian's status sensor comes from the Rivian charge adapter
#      (sensor.<title>_solar_adapter_evcc_status, e.g. sensor.r1s_solar_adapter_evcc_status).
#      Point the adapter's vehicle override option at input_select.twc3_vehicle_override
#      so both sensors honor the same override.
#   3. Two evcc sensors from one REST resource, a stale-input sensor and two watchdogs.
#      evcc keeps the last value of an unavailable meter, and nothing stops a car if evcc
#      itself stops. Point the adapter's evcc liveness option at sensor.evcc_api and its
#      evcc charging enabled option at binary_sensor.evcc_rivian_charging_enabled.
#   4. A Tesla amp restore at unplug. The Tesla keeps the last current evcc set, so a
#      later manual charge would otherwise start at that current, possibly 6 A.

input_select:
  twc3_vehicle_override:
    name: Wall Connector vehicle
    # "auto" lets both status sensors work normally. Choosing a car forces the other
    # car's status to "a". The adapter treats "auto" and "rivian" as no override.
    options:
      - auto
      - tesla
      - rivian
    initial: auto
    icon: mdi:ev-station

input_number:
  tesla_normal_charge_amps:
    name: Tesla normal charging amps
    # Restored when the Tesla unplugs at home. "initial" resets it at every HA restart,
    # so change the value here; a change in the UI lasts until the next restart.
    min: 6
    max: 48
    step: 1
    initial: 32
    unit_of_measurement: A
    mode: box
    icon: mdi:current-ac

rest:
  # evcc's /api/state needs no login; jq trims the answer to what the adapter uses.
  # Both entities come from this one resource, so they always change together.
  # This detects a stopped evcc, not one that runs but no longer updates.
  - resource: http://<evcc_host>:7070/api/state
    params:
      jq: "{version: .version, lp: (.loadpoints[0] | {enabled, vehicleName})}"
    scan_interval: 30
    timeout: 10
    sensor:
      # evcc liveness: unavailable whenever evcc does not answer properly (add-on
      # stopped, crashed or still starting). Do not use an ha-evcc entity for this:
      # with ha-evcc's default websocket connection its entities stay available after
      # evcc stops.
      - name: evcc api
        unique_id: evcc_api_liveness
        availability: "{{ value_json is mapping and value_json.version is string }}"
        value_template: "{{ value_json.version }}"
        icon: mdi:heart-pulse
    binary_sensor:
      # On while evcc's loadpoint has charging enabled for the Rivian. evcc keeps this
      # through an outage of the liveness sensor, but a restarted evcc starts with it off
      # unless the car is charging, so the adapter can tell the two apart. "rivian" is
      # the vehicle name in evcc.yaml.
      - name: evcc rivian charging enabled
        unique_id: evcc_rivian_charging_enabled
        availability: "{{ value_json is mapping and value_json.lp is mapping }}"
        value_template: >-
          {{ value_json.lp.enabled is sameas true
             and value_json.lp.vehicleName == 'rivian' }}
        icon: mdi:ev-station

template:
  - sensor:
      - name: evcc_tesla_status
        unique_id: evcc_tesla_status
        # Teslemetry entity names depend on the car's name in HA; copy them from its device page.
        state: >
          {%- set override = states('input_select.twc3_vehicle_override') -%}
          {%- set home = is_state('<device_tracker.tesla_location>', 'home') -%}
          {%- set plugged = is_state('<binary_sensor.tesla_charge_cable>', 'on') -%}
          {%- set twc = is_state('binary_sensor.tesla_wall_connector_vehicle_connected', 'on') -%}
          {%- set charging = states('<sensor.tesla_charging>') in ['starting', 'charging'] -%}
          {{ 'a' if override == 'rivian' or not (home and plugged and twc)
             else ('c' if charging else 'b') }}

  - binary_sensor:
      - name: ev_solar_inputs_stale
        unique_id: ev_solar_inputs_stale
        device_class: problem
        # last_reported changes on every report, even an unchanged value. Grid power from
        # the Sol-Ark normally reports within seconds; 120 s matches the prototype's gate.
        state: >
          {%- set grid = states.sensor.sol_ark_inverter_grid_power -%}
          {%- set batt = states.sensor.sol_ark_inverter_battery_power -%}
          {{ grid is none or batt is none
             or grid.state in ['unknown', 'unavailable']
             or batt.state in ['unknown', 'unavailable']
             or (now() - grid.last_reported).total_seconds() > 120
             or (now() - batt.last_reported).total_seconds() > 120 }}

automation:
  - alias: EV solar watchdog - stale site inputs stop solar charging
    id: ev_solar_watchdog_stale_inputs
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.ev_solar_inputs_stale
        to: "on"
        for: "00:01:00"
    conditions:
      # ha-evcc names entities <type>.<installation name>_<loadpoint id>_<key>; check yours.
      - condition: state
        entity_id: <select.evcc_lp1_mode>
        state: smart
    actions:
      # evcc then stops whichever car it has identified; for the Rivian the adapter
      # parks its charging window.
      - action: select.select_option
        target:
          entity_id: <select.evcc_lp1_mode>
        data:
          option: "off"
      - action: persistent_notification.create
        data:
          title: EV solar charging stopped
          message: >
            Site power readings are stale, so evcc was switched off. Check the Sol-Ark
            feed, then set the evcc mode back to smart by hand.

  - alias: EV solar watchdog - evcc unavailable stops both cars
    id: ev_solar_watchdog_evcc_down
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.evcc_api
        to: unavailable
        for: "00:05:00"
    actions:
      - if:
          - condition: state
            entity_id: sensor.evcc_tesla_status
            state: c
        then:
          - action: switch.turn_off
            target:
              entity_id: <switch.tesla_charge>
      # Belt and braces: with sensor.evcc_api as its liveness entity, the adapter stops
      # renewing at once and, after 3 minutes, drops evcc's request and parks its
      # window itself. This also covers an adapter without the liveness option. Only
      # turn the switch off while it is on: without a liveness entity, an "off" command
      # to an idle adapter while the car is plugged in at home would take ownership of
      # the schedule just to park it.
      - if:
          - condition: state
            entity_id: switch.r1s_solar_adapter_solar_charging
            state: "on"
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.r1s_solar_adapter_solar_charging
      - action: persistent_notification.create
        data:
          title: evcc unavailable
          message: >
            evcc has been unavailable for 5 minutes. A Tesla charging at the Wall
            Connector was stopped, and the Rivian charge adapter's Solar charging switch,
            if on, was turned off. Restart the evcc add-on, then resume from evcc.

  - alias: Tesla - restore normal charging amps at unplug
    id: tesla_restore_normal_charge_amps
    mode: single
    # evcc leaves the Tesla at the last current it set. Restore the normal value when the
    # Tesla unplugs at home, so a later manual or app start does not begin at 6 A.
    triggers:
      - trigger: state
        entity_id: <binary_sensor.tesla_charge_cable>
        from: "on"
        to: "off"
    conditions:
      - condition: state
        entity_id: <device_tracker.tesla_location>
        state: home
      # Skip the command (and a possible wake) when the value is already right.
      - condition: template
        value_template: >
          {{ states('<number.tesla_charge_current>') | int(0)
             != states('input_number.tesla_normal_charge_amps') | int(32) }}
    actions:
      - action: number.set_value
        target:
          entity_id: <number.tesla_charge_current>
        data:
          value: "{{ states('input_number.tesla_normal_charge_amps') | int(32) }}"
