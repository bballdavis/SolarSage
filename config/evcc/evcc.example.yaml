# DRAFT evcc configuration for the Tesla + Rivian + Tesla Wall Connector Gen 3 site.
#
# Status: untested against this installation. Read docs/SOLAR_CHARGING_ARCHITECTURE.md
# and follow docs/ROADMAP.md phase by phase before enabling any control.
#
# Target: evcc 0.318.0 running as the Home Assistant add-on (add-on version 0.318.0).
# Needs evcc >= 0.316 for the off/smart/now mode names.
# Add-on config path: /addon_configs/49686a9f_evcc/evcc.yaml
#
# - Replace every <placeholder> and check each entity ID in Developer Tools > States.
# - Loadpoint phases / minCurrent / maxCurrent in YAML are not applied. evcc only logs a
#   startup warning ("ignoring deprecated ..., please configure via UI"). Set them in the
#   evcc UI or through ha-evcc: phases = 1, min 6 A, max = TWC3 limit.
# - Site battery settings (prioritySoc / bufferSoc / bufferStartSoc) are also set in the UI.

interval: 30s # evcc treats values below 30 s as unsupported

log: info
levels:
  site: debug
  lp-1: debug

site:
  title: Home
  meters:
    grid: grid
    pv:
      - pv
    battery:
      - battery
  # evcc models power with a fixed 230 V; this is a 240 V split-phase service.
  # A small positive residual biases the loop toward slight export.
  residualPower: 150 # W

meters:
  # uri http://supervisor/core uses the add-on's supervisor token. Do not add a token: key;
  # evcc ignores it and logs a warning.
  - name: grid
    type: template
    template: homeassistant
    usage: grid
    uri: http://supervisor/core
    power: sensor.sol_ark_inverter_grid_power # Sol-Ark: + import / - export (same as evcc)

  - name: pv
    type: template
    template: homeassistant
    usage: pv
    uri: http://supervisor/core
    power: sensor.sol_ark_inverter_pv_power

  - name: battery
    type: template
    template: homeassistant
    usage: battery
    uri: http://supervisor/core
    # Sol-Ark reports + charging / - discharging; evcc expects + discharging.
    # The leading "-" inverts the sign.
    power: -sensor.sol_ark_inverter_battery_power
    soc: sensor.sol_ark_inverter_battery_state_of_charge
    capacity: 31 # kWh usable (estimate from sensor.sol_ark_battery_capacity_estimate)

chargers:
  # evcc polls the Wall Connector's local /api/1/vitals itself. Start/stop and current
  # are delegated to whichever vehicle evcc has identified on this loadpoint.
  - name: twc3
    type: template
    template: twc3
    host: <twc3-ip-or-hostname> # use a DHCP reservation

vehicles:
  # Tesla: entities from HA core Teslemetry (Bluetooth sub-entry preferred).
  # Entity names depend on the vehicle name in HA; copy them from the device page.
  - name: tesla
    type: template
    template: homeassistant
    title: Tesla
    uri: http://supervisor/core
    capacity: <usable-kWh>
    phases: 1
    minCurrent: 6 # stay above the 5 A boundary; stop below it instead of trickling
    maxCurrent: 48
    soc: <sensor.tesla_battery_level>
    limitSoc: <number.tesla_charge_limit>
    status: sensor.evcc_tesla_status # from config/homeassistant/packages/ev_solar_glue.example.yaml
    # Phase 1 (observe only): leave the next lines commented out.
    # Phase 2: enable them. A switch alone provides both start and stop.
    # start_charging: <switch.tesla_charge>
    # setMaxCurrent: <number.tesla_charge_current>
    # wakeup: <button.tesla_wake>

  # Rivian R1S (Gen 2): read-only until the attended trial (roadmap phase 3) passes and
  # phase 4A wires the Rivian charge adapter (custom_components/rivian_solar_adapter) in.
  # Adapter entity IDs follow its config entry title; these assume the title "R1S".
  # Copy the real IDs from the adapter's device page. Keep the name "rivian": the glue
  # package's binary_sensor.evcc_rivian_charging_enabled matches evcc's vehicleName to it.
  - name: rivian
    type: template
    template: homeassistant
    title: Rivian R1S
    uri: http://supervisor/core
    capacity: <usable-kWh>
    phases: 1
    # The adapter applies even 8-48 A and never less than 8 A. A lower minimum would make
    # evcc see more current than it offered and re-send the current every cycle.
    minCurrent: 8
    maxCurrent: 48
    # Remove when enabling adapter control in phase 4A.
    # Until then evcc cannot stop or modulate the Rivian. "now" makes evcc ignore the
    # missing current control on the TWC3. The car follows its own schedule, and evcc
    # logs "vehicle not capable of start/stop" while it is plugged in.
    mode: now
    soc: sensor.r1s_battery_state_of_charge
    limitSoc: sensor.r1s_battery_state_of_charge_limit
    # The adapter's status sensor: "a" unless the car is known plugged in at home, the
    # Wall Connector (if mapped) does not report "no vehicle", and the adapter's override
    # option (input_select.twc3_vehicle_override) does not name the Tesla. It works in
    # dry run too.
    status: sensor.r1s_solar_adapter_evcc_status
    # Phase 4A only (after the trial; remove "mode: now" above at the same time):
    # start_charging: switch.r1s_solar_adapter_solar_charging
    # setMaxCurrent: number.r1s_solar_adapter_solar_current

loadpoints:
  - title: Garage
    charger: twc3
    # No "vehicle:" line on purpose. A default vehicle disables detection, and evcc
    # would then command that car even when the other one is plugged in.
    # Default mode: evcc re-applies it at every unplug. Phase 1 observes only ("off").
    # From phase 2 set it to smart here; a mode set only in the UI lasts one session.
    mode: "off"
    enable:
      delay: 2m
    disable:
      delay: 5m # fewer cloud commands; the house battery buffer bridges clouds

tariffs:
  currency: USD
  grid:
    type: fixed
    price: <0.00> # $/kWh; use zones if a time-of-use tariff applies
  feedin:
    type: fixed
    price: <0.00>
  solar:
    # Reads the solar forecast configured in the HA Energy dashboard (Solcast),
    # without spending Solcast API calls. Display-only unless the sponsor-only,
    # experimental optimizer is enabled.
    - type: template
      template: homeassistant
      uri: http://supervisor/core
