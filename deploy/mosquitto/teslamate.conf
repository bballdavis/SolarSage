# TeslaMate -> Home Assistant: read-only bridge of Roxxo's charging topics from TeslaMate's
# broker on turbonas. Only these topics come in (no GPS); nothing goes out.
# bridge/teslamate/state is 1 while the bridge is up, 0 when it is down (the entities'
# availability).
connection teslamate
address 192.168.1.7:1883
bridge_protocol_version mqttv311
cleansession true
start_type automatic
restart_timeout 10 60
try_private false
notifications true
notifications_local_only true
notification_topic bridge/teslamate/state
topic teslamate/cars/1/battery_level in 0
topic teslamate/cars/1/charge_limit_soc in 0
topic teslamate/cars/1/plugged_in in 0
topic teslamate/cars/1/charging_state in 0
topic teslamate/cars/1/state in 0
topic teslamate/cars/1/geofence in 0
topic teslamate/cars/1/charger_actual_current in 0
topic teslamate/cars/1/charger_power in 0
topic teslamate/cars/1/charge_current_request in 0
