# Tesla Fleet public key for Home Assistant's Tesla Fleet integration.
# Lives on turbonas at /share/Containers/Traefik/rules/tslakey.yml (Traefik file provider).
#
# Serves exactly one public file: GET/HEAD of the Tesla key path on tslakey.davisho.me.
# The request is rewritten to that one file in Home Assistant's /config/www, so no other
# Home Assistant path is reachable through this host. Anything else here gets Traefik's 404.
# The private key (/config/tesla_fleet.key) is never in /config/www.
http:
  routers:
    tslakey:
      entryPoints:
        - websecure
      rule: "Host(`tslakey.davisho.me`) && Path(`/.well-known/appspecific/com.tesla.3p.public-key.pem`) && (Method(`GET`) || Method(`HEAD`))"
      service: tslakey-hass
      middlewares:
        - tslakey-path
        - tslakey-headers

  middlewares:
    tslakey-path:
      replacePath:
        path: "/local/tesla/com.tesla.3p.public-key.pem"
    tslakey-headers:
      headers:
        # Home Assistant answers 400 to proxied requests unless it trusts the proxy;
        # dropping the forwarding headers keeps this a plain request from turbonas.
        customRequestHeaders:
          X-Forwarded-For: ""
          X-Forwarded-Host: ""
          X-Forwarded-Proto: ""
          X-Forwarded-Port: ""
          X-Forwarded-Server: ""
          X-Real-Ip: ""
        customResponseHeaders:
          Content-Type: "application/x-pem-file"

  services:
    tslakey-hass:
      loadBalancer:
        servers:
          - url: "http://192.168.1.80:8123"
