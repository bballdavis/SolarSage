name: Validate

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend syntax and controller contracts
        run: |
          node --check custom_components/rivian/solar_ev_charging/frontend/solar-panel.js
          node tools/test-solar-ui.mjs
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            homeassistant: "2025.1.4"
          - python: "3.14"
            homeassistant: "2026.9.3"
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools and runtime
        run: >-
          python -m pip install pytest ruff homeassistant==${{ matrix.homeassistant }}
          "rivian-python-client[ble]==2.0.0" pyserial
      - name: Lint
        run: ruff check custom_components tests
      - name: Unit and HA smoke tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q custom_components tests
